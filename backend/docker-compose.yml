version: '3.8'

services:
  backend:
    build: .
    container_name: bia-loyalty-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-your_super_secret_jwt_key_change_in_production_min_32_chars}
      - JWT_EXPIRE=7d
      - DB_PATH=/app/data/loyalty.db
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - APP_NAME=BIA Loyalty Engine
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - bia-network

networks:
  bia-network:
    driver: bridge
